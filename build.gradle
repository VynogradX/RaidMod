plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.141' }
group = 'com.hanset.raidmod'
version = '1.0.0'
base { archivesName = 'raidmod-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
neoForge {
    version = '21.1.227'
    runs { server { server(); programArgument '--nogui' } }
    mods { raidmod { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
